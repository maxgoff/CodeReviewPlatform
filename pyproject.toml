[project]
name = "reviewbot"
version = "0.1.0"
description = "Multi-agent AI pull request reviewer built on the Claude API"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
reviewbot = "reviewbot.cli:main"
reviewbot-server = "reviewbot.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reviewbot*"]

[tool.setuptools.package-data]
reviewbot = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
